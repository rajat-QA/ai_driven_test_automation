name: Playwright Bookings E2E
on:
  push:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Playwright Docker image
      run: docker build --tag playwright-bookings-tests .
    - name: Run Playwright tests in Docker
      shell: bash
      run: |
        set +e
        docker run --name playwright-bookings-tests playwright-bookings-tests
        test_exit=$?
        docker cp playwright-bookings-tests:/app/playwright-report ./playwright-report || true
        docker cp playwright-bookings-tests:/app/test-results ./test-results || true
        docker rm playwright-bookings-tests
        exit "$test_exit"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30